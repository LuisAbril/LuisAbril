<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="55%" stop-color="#0b1026"/>
      <stop offset="100%" stop-color="#140a2e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
      @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(120px,40px); } }
      @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-140px,-30px); } }
      .title { font: 800 64px 'Segoe UI', 'Inter', Arial, sans-serif; letter-spacing: -1px; }
      .sub { font: 500 24px 'Segoe UI', 'Inter', Arial, sans-serif; fill: #cbd5e1; }
      .tag { font: 600 15px 'Consolas', 'JetBrains Mono', monospace; fill: #e2e8f0; }
      .mono { font: 500 15px 'Consolas', 'JetBrains Mono', monospace; }
      .fade1 { opacity: 0; animation: up .9s ease-out .1s forwards; }
      .fade2 { opacity: 0; animation: up .9s ease-out .5s forwards; }
      .fade3 { opacity: 0; animation: up .9s ease-out .9s forwards; }
      .fade4 { opacity: 0; animation: up .9s ease-out 1.3s forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .node { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
      .flow { stroke-dasharray: 6 8; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -28; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="orb1" cx="180" cy="60" r="220" fill="url(#glow1)"/>
    <circle class="orb2" cx="1040" cy="280" r="260" fill="url(#glow2)"/>

    <!-- chat / agent network on the right -->
    <g transform="translate(860,70)">
      <path class="flow" d="M40 40 L170 20 M40 40 L110 130 M170 20 L250 110 M110 130 L250 110 M110 130 L60 200 M250 110 L200 200" stroke="#a78bfa" stroke-opacity=".6" stroke-width="2" fill="none"/>
      <circle class="node" cx="40" cy="40" r="9" fill="#22d3ee"/>
      <circle class="node n2" cx="170" cy="20" r="7" fill="#a78bfa"/>
      <circle class="node n3" cx="110" cy="130" r="11" fill="#f472b6"/>
      <circle class="node n4" cx="250" cy="110" r="8" fill="#22d3ee"/>
      <circle class="node n2" cx="60" cy="200" r="6" fill="#a78bfa"/>
      <circle class="node n3" cx="200" cy="200" r="7" fill="#f472b6"/>
      <g transform="translate(130,145)">
        <rect width="120" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
        <circle cx="30" cy="17" r="4" fill="#94a3b8" class="node"/>
        <circle cx="60" cy="17" r="4" fill="#94a3b8" class="node n2"/>
        <circle cx="90" cy="17" r="4" fill="#94a3b8" class="node n3"/>
      </g>
    </g>

    <g transform="translate(70,0)">
      <text class="mono fade1" x="0" y="78" fill="#22d3ee">~/madrid $ whoami<tspan class="cursor" fill="#22d3ee"> █</tspan></text>
      <text class="title fade2" x="0" y="152" fill="url(#txt)">Luis Abril Andreu</text>
      <text class="sub fade3" x="2" y="194">Software Engineer · Asistentes digitales &amp; IA conversacional</text>

      <g class="fade4" transform="translate(0,226)">
        <rect width="186" height="36" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#22d3ee" stroke-opacity=".5"/>
        <text class="tag" x="18" y="23">🤖 Cognigy · Amelia</text>
        <g transform="translate(200,0)">
          <rect width="170" height="36" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#a78bfa" stroke-opacity=".5"/>
          <text class="tag" x="18" y="23">⚡ Automatización</text>
        </g>
        <g transform="translate(384,0)">
          <rect width="150" height="36" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#f472b6" stroke-opacity=".5"/>
          <text class="tag" x="18" y="23">🧠 Claude + MCP</text>
        </g>
      </g>
    </g>
  </g>
  <rect width="1199" height="319" x=".5" y=".5" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
