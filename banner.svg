    <text x="0" y="90" font-size="20" opacity="0.95">Estudiante de Ingeniería de Software · 21 años</text>
    <text x="0" y="130" font-size="18" opacity="0.9">Me encanta diseñar algoritmos creativos y aprender nuevas herramientas.</text>
